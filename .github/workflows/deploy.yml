name: Hubquick CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-deploy-backend:
    name: Test & Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Integration Tests
        run: |
          cd backend
          npm run test

      - name: Deploy Cloudflare Worker
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: backend

  package-extension:
    name: Package Chrome Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Production API URL
        run: |
          # Determine the production API URL (falls back to your yoyocodedz subdomain)
          API_URL="${{ vars.PRODUCTION_API_URL || 'https://hubquick-backend.yoyocodedz.workers.dev' }}"
          echo "Injecting production API URL: $API_URL"
          
          # Replace the local dev API URL in content.js and popup.js
          sed -i "s|const API_BASE_URL = 'http://127.0.0.1:8787';|const API_BASE_URL = '$API_URL';|g" content.js
          sed -i "s|const API_BASE_URL = 'http://127.0.0.1:8787';|const API_BASE_URL = '$API_URL';|g" popup.js

      - name: Create Production Bundle Zip
        run: |
          # Ensure placeholder files exist for icons in CI to prevent zip errors if assets are missing
          touch icon16.png icon48.png icon128.png
          
          # Zip the required extension assets for Web Store upload
          zip -r hubquick-extension.zip \
            manifest.json \
            background.js \
            content.js \
            popup.html \
            popup.js \
            styles.css \
            icon16.png \
            icon48.png \
            icon128.png

      - name: Upload Packaged Zip as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hubquick-chrome-extension
          path: hubquick-extension.zip
          retention-days: 14
