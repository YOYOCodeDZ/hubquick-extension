# wrangler.toml - Wrangler configuration for Hubquick Cloudflare Worker

name = "hubquick-backend"
main = "src/index.ts"
compatibility_date = "2024-04-05"

# Environment variables bindings
[vars]
ENVIRONMENT = "development"
# In production, STRIPE_WEBHOOK_SECRET and SUPABASE_URL should be added as secret bindings
# via command line: wrangler secret put <SECRET_NAME>
